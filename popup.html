<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  body {
    width: 280px; margin: 0; padding: 14px 16px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 13px; color: #222;
  }
  h1 { font-size: 15px; margin: 0 0 12px; }
  .row { margin-bottom: 12px; }
  label { display: block; margin-bottom: 4px; color: #555; }
  select, input {
    width: 100%; box-sizing: border-box;
    padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px;
    font-size: 13px;
  }
  .hint { color: #999; font-size: 11px; margin-top: 4px; line-height: 1.5; }
  .switch-row { display: flex; align-items: center; gap: 8px; }
  .switch-row label { margin: 0; color: #222; }
  .switch-row input { width: auto; }
  #status { color: #2a7; font-size: 12px; height: 16px; }
</style>
</head>
<body>
  <h1>字幕划词翻译</h1>

  <div class="row switch-row">
    <input type="checkbox" id="enabled">
    <label for="enabled">启用划词翻译</label>
  </div>

  <div class="row">
    <label for="targetLang">目标语言</label>
    <select id="targetLang">
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁体中文</option>
      <option value="en">英语</option>
      <option value="ja">日语</option>
      <option value="ko">韩语</option>
      <option value="fr">法语</option>
      <option value="de">德语</option>
      <option value="es">西班牙语</option>
      <option value="ru">俄语</option>
      <option value="pt">葡萄牙语</option>
      <option value="it">意大利语</option>
      <option value="ar">阿拉伯语</option>
    </select>
  </div>

  <div class="row">
    <label for="provider">翻译引擎</label>
    <select id="provider">
      <option value="mymemory">MyMemory（免费，国内直连，推荐）</option>
      <option value="google">Google 翻译（需代理）</option>
      <option value="ollama">本地 Ollama（无额度限制，需启动）</option>
    </select>
    <div class="hint">MyMemory 免费额度约 5000 字符/天，用完可切 Ollama</div>
  </div>

  <div class="row" id="ollamaRow" style="display:none">
    <label for="ollamaModel">Ollama 模型名</label>
    <input type="text" id="ollamaModel" placeholder="如 qwen2.5:7b">
    <div class="hint">需先在终端执行 ollama pull &lt;模型名&gt; 并保持 Ollama 运行</div>
  </div>

  <div class="row">
    <label for="autoHide">字幕自动消失时间（秒，0 = 不自动消失）</label>
    <input type="number" id="autoHide" min="0" max="60" step="1">
  </div>

  <div id="status"></div>
  <div class="hint">用法：选中文字 → 点击「译」按钮，或按 Alt+T。悬停字幕可暂停消失，Esc 关闭。</div>

  <script src="popup.js"></script>
</body>
</html>
